name: Executáveis

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            args: --linux
            files: release/*.AppImage
          - name: macOS
            os: macos-latest
            args: --mac
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar o jogo (dist/PitchInvaders.html)
        run: npm run build

      - name: Empacotar com electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: PitchInvaders-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}

  simples:
    name: Versão simples (Jogar.exe + PitchInvaders.zip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instalar MinGW-w64 (para compilar o Jogar.exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Regenerar o pacote e comparar com o que está no repositório
        run: |
          bash scripts/package.sh /tmp/novo.zip
          if ! git diff --quiet -- dist/PitchInvaders.html Jogar.exe; then
            git diff --stat -- dist/PitchInvaders.html Jogar.exe
            echo "::error::dist/PitchInvaders.html ou Jogar.exe desatualizados. Corre 'npm run pacote' e faz commit."
            exit 1
          fi
          mkdir -p /tmp/a /tmp/b
          unzip -q PitchInvaders.zip -d /tmp/a
          unzip -q /tmp/novo.zip -d /tmp/b
          if ! diff -r /tmp/a /tmp/b || ! diff <(zipinfo PitchInvaders.zip | awk '/^[-d][-r]/ {print $1, $NF}') <(zipinfo /tmp/novo.zip | awk '/^[-d][-r]/ {print $1, $NF}'); then
            echo "::error::PitchInvaders.zip desatualizado. Corre 'npm run pacote' e faz commit."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PitchInvaders-simples
          path: PitchInvaders.zip

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PitchInvaders.zip
            dist/PitchInvaders.html
