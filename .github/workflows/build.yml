name: Executáveis

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            args: --linux
            files: release/*.AppImage
          - name: macOS
            os: macos-latest
            args: --mac
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar o jogo (dist/PitchInvaders.html)
        run: npm run build

      - name: Empacotar com electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: PitchInvaders-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}

  simples:
    name: Versão simples (Jogar.exe + PitchInvaders.zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificar que o jogo publicado está atualizado
        run: |
          npm run build
          if ! git diff --quiet -- dist/PitchInvaders.html; then
            echo "::error::dist/PitchInvaders.html está desatualizado. Corre 'npm run pacote' e faz commit."
            exit 1
          fi
          mkdir -p zipcheck && unzip -q PitchInvaders.zip -d zipcheck
          for f in Jogar.exe Jogar.command dist/PitchInvaders.html; do
            if ! cmp -s "zipcheck/$f" "$f"; then
              echo "::error::PitchInvaders.zip tem uma versão antiga de $f. Corre 'npm run pacote' e faz commit."
              exit 1
            fi
          done
          test -x zipcheck/Jogar.command

      - name: Compilar o lançador Jogar.exe (verificação)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          bash scripts/build-launcher.sh /tmp/Jogar-ci.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PitchInvaders-simples
          path: zipcheck/

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PitchInvaders.zip
            dist/PitchInvaders.html
